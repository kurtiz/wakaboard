name: Native Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: both
        options:
          - android
          - ios
          - both
  push:
    branches: [preview, release]

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'android' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/WakaBoard.xcworkspace \
            -scheme WakaBoard \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package iOS Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/WakaBoard.app" "$RUNNER_TEMP/WakaBoard-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/WakaBoard-ios-simulator.zip
          if-no-files-found: error
